[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
auto_detect_solc = false
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = true
deny = "warnings"
ignored_warnings_from = ["lib/"]
auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "solady/=lib/solady/src/",
]
no_match_path = "test/{fork,invariant}/**"
chain_id = 50312
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read", path = "./test/reference" },
  { access = "write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 256
fail_on_revert = true

[profile.default.invariant]
runs = 8
depth = 32
fail_on_revert = false
show_metrics = true

[profile.full]
no_match_path = "test/fork/**"

[profile.full.fuzz]
runs = 1024

[profile.full.invariant]
runs = 24
depth = 64
fail_on_revert = false
show_metrics = true

[profile.fork]
match_path = "test/fork/**"
no_match_path = "__never_match__"

[profile.fork.fuzz]
runs = 64

[rpc_endpoints]
somnia_testnet = "https://api.infra.testnet.somnia.network"
somnia_mainnet = "https://api.infra.mainnet.somnia.network"

[fmt]
tab_width = 2
line_length = 100
sort_imports = false
